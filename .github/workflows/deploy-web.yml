name: Deploy Web

# Builds the site with Skrapa and publishes web/dist to GitHub Pages. The custom domain
# (menu-otp.iambrian.com) and the "GitHub Actions" source are set in the repository's
# Pages settings, not by a committed CNAME file.
#
# Not triggered by pushes itself: release.yml calls it as its last job, with the
# release tag when it cut one. The site shows the app's version, and a push-triggered
# deploy would build the commit from *before* the version bump, then race the
# pipeline's own deploy. Run it by hand to redeploy main as it stands.
on:
    workflow_call:
        inputs:
            ref:
                description: 'Tag or commit to build the site from'
                required: true
                type: string
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'deploy-web'
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref || github.ref }}

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'

            # The site shows web/version.json's version, a copy of the app's version in
            # app/Resources/Info.plist. Don't publish a number the app doesn't have.
            - name: Check the version is in sync
              run: .scripts/version.mjs --check

            - name: Install dependencies
              run: npm ci

            - name: Build site
              run: npm run build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: web/dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
